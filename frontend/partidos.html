<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Partidos - Peña Zaragocista</title>
</head>
<body class="bg-light">
    <div id="header-placeholder"></div>
    
    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
            <div>
                <h2 class="text-primary fw-bold mb-0">
                    <i class="fas fa-futbol me-2"></i>Partidos Real Zaragoza
                </h2>
                <small class="text-muted">Calendario oficial de la temporada</small>
            </div>
            <a href="clasificacion.html" class="btn btn-sm btn-outline-primary fw-bold shadow-sm">
                <i class="fas fa-trophy me-1"></i> Clasificación
            </a>
        </div>

        <!-- Contenedor con mini-tarjetas comprimidas -->
        <div id="lista-partidos-zaragoza" class="row g-2 justify-content-center">
            <div class="col-12 text-center py-4">
                <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                <p class="mt-2 text-muted small">Cargando partidos del Real Zaragoza...</p>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const contenedor = document.getElementById('lista-partidos-zaragoza');
            
            try {
                const response = await fetch("http://localhost:8000/partidos-zaragoza");
                if (!response.ok) throw new Error("Error al consultar la API");
                
                const data = await response.json();
                const partidos = data.partidos || []; 

                contenedor.innerHTML = ""; 

                if (!partidos || partidos.length === 0) {
                    contenedor.innerHTML = `
                        <div class="col-12">
                            <div class="alert alert-info text-center p-2 small border-0 shadow-sm">
                                No hay partidos programados actualmente para el Real Zaragoza.
                            </div>
                        </div>`;
                } else {
                    partidos.forEach(p => {
                        const fixture = p.fixture || {};
                        const teams = p.teams || {};
                        const goals = p.goals || {};
                        const league = p.league || {};

                        // Nombres de equipos y escudos
                        const equipoLocal = teams.home?.name || "Real Zaragoza";
                        const equipoVisitante = teams.away?.name || "Rival";
                        const escudoLocal = teams.home?.logo || "";
                        const escudoVisitante = teams.away?.logo || "";
                        
                        // Estado del partido
                        const estadoShort = fixture.status?.short;
                        const haTerminado = ['FT', 'AET', 'PEN'].includes(estadoShort);
                        const enDirecto = ['1H', 'HT', '2H', 'ET', 'P', 'LIVE'].includes(estadoShort);

                        // Marcador
                        let marcador = "VS";
                        if (haTerminado || enDirecto) {
                            marcador = `${goals.home ?? 0} - ${goals.away ?? 0}`;
                        }

                        // Lógica para badge superior y pie de tarjeta (Finalizado arriba, Resultado/Fecha abajo)
                        let badgeEstado = '<span class="badge bg-warning text-dark" style="font-size: 0.65rem;">Pendiente</span>';
                        let textoPie = '';

                        if (haTerminado) {
                            badgeEstado = '<span class="badge bg-success" style="font-size: 0.65rem;">Finalizado</span>';
                            
                            const signo = fixture.resultado_signo; // Victoria, Empate o Derrota
                            if (signo === "Victoria") {
                                textoPie = '<span class="text-success fw-bold"><i class="fas fa-check-circle me-1"></i>Victoria</span>';
                            } else if (signo === "Derrota") {
                                textoPie = '<span class="text-danger fw-bold"><i class="fas fa-times-circle me-1"></i>Derrota</span>';
                            } else {
                                textoPie = '<span class="text-warning text-dark fw-bold"><i class="fas fa-minus-circle me-1"></i>Empate</span>';
                            }
                        } else if (enDirecto) {
                            badgeEstado = '<span class="badge bg-danger blink" style="font-size: 0.65rem;">EN DIRECTO</span>';
                            textoPie = '<span class="text-danger fw-bold">Jugándose ahora</span>';
                        } else {
                            // Si está PENDIENTE, usamos la fecha y hora reales
                            const fechaObj = fixture.date ? new Date(fixture.date) : null;
                            const fecha = fechaObj ? fechaObj.toLocaleDateString('es-ES') : 'Por determinar';
                            const hora = fechaObj ? fechaObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                            
                            textoPie = `<i class="far fa-calendar-alt me-1"></i>${fecha} ${hora ? `| ${hora}` : ''}`;
                        }

                        // Extraer número de jornada
                        const jornada = league.round ? league.round.replace(/[^0-9]/g, '') : '-';

                        contenedor.innerHTML += `
                            <div class="col-6 col-md-4 col-lg-3">
                                <div class="card h-100 shadow-sm border-0 gallery-card">
                                    <div class="card-body text-center p-2 d-flex flex-column justify-content-between">
                                        <div>
                                            <div class="d-flex justify-content-between align-items-center mb-1">
                                                <span class="badge bg-light text-dark border style-lh-sm" style="font-size: 0.65rem;">J${jornada}</span>
                                                ${badgeEstado}
                                            </div>
                                            
                                            <div class="d-flex align-items-center justify-content-center my-2 gap-1">
                                                ${escudoLocal ? `<img src="${escudoLocal}" width="20" height="20" alt="logo">` : ''}
                                                <span class="fw-bold text-dark lh-sm" style="font-size: 0.8rem;">${equipoLocal}</span>
                                            </div>
                                            <span class="text-muted fw-normal d-block my-0" style="font-size: 0.75rem;">vs</span>
                                            <div class="d-flex align-items-center justify-content-center my-2 gap-1">
                                                ${escudoVisitante ? `<img src="${escudoVisitante}" width="20" height="20" alt="logo">` : ''}
                                                <span class="fw-bold text-dark lh-sm" style="font-size: 0.8rem;">${equipoVisitante}</span>
                                            </div>
                                        </div>

                                        <div>
                                            <h4 class="my-1 fw-bold ${haTerminado ? 'text-primary' : (enDirecto ? 'text-danger' : 'text-secondary')}" style="font-size: 1.2rem;">
                                                ${marcador}
                                            </h4>
                                            
                                            <div class="text-muted border-top pt-1 mt-1" style="font-size: 0.7rem;">
                                                ${textoPie}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (error) {
                console.error("Error al cargar partidos:", error);
                contenedor.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger text-center p-2 small border-0 shadow-sm">
                            Error al conectar con la API de partidos. Asegúrate de tener arrancado el Backend.
                        </div>
                    </div>`;
            }
        });
    </script>
</body>
</html>
