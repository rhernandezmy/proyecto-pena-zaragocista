<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clasificación - Peña Zaragocista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <div id="header-placeholder"></div>

    <main class="container py-5">
        <h2 class="fw-bold mb-4">🛡️ Clasificación Real Zaragoza pendiente de confirmar grupos</h2>
        <div id="clasificacion-container" class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Equipo</th>
                        <th scope="col">Puntos</th>
                        <th scope="col">PJ</th>
                        <th scope="col">PG</th>
                        <th scope="col">PE</th>
                        <th scope="col">PP</th>
                        <th scope="col">GF</th>
                        <th scope="col">GC</th>
                        <th scope="col">DG</th>
                    </tr>
                </thead>
                <tbody id="clasificacion-body">
                    <!-- Filas de la clasificación se generarán dinámicamente -->
                </tbody>
            </table>
        </main>

    <div id="footer-placeholder"></div>
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/clasificacion.js"></script>
</body>
</html>
